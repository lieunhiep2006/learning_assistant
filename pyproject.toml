
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-assistant"
version = "0.1.0"
description = "A learning assistant AI project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]<2",
    "python-dotenv",
    "groq>=0.4.0",
    "jsonschema>=4.0.0",
    "rank-bm25>=0.2.2",
    "numpy>=2.2.6",
    "requests>=2.34.2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]
